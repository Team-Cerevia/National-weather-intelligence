services:
  - type: web
    name: meteora-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: singapore
    envVars:
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: meteora-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    plan: free
    region: singapore
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://meteora-backend.onrender.com/api/v1


