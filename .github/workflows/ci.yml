name: CI Workflow

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint, Secret Scan & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Secret & API Key Leaks (Gitleaks)
        run: |
          curl -sSFL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source=. --verbose

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync

      - name: Run Ruff Linter Check
        run: uv run python -m ruff check .

      - name: Run Ruff Format Check
        run: uv run python -m ruff format --check .

      - name: Run Pytest Unit Tests
        run: uv run python -m pytest tests/ -v
