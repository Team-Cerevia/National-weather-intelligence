[project]
name = "national-weather-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harveen Kaur", email = "harveenkaur282@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "h3>=4.5.0",
    "httpx>=0.27.0",
    "imagehash>=4.3.1",
    "onnxruntime>=1.20.0",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "redis>=5.0.0",
    "ruff>=0.9.0",
    "scikit-learn>=1.6.0",
    "spacy>=3.8.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]




[tool.uv_build]
packages = ["contracts", "ingestion", "streaming", "nlp", "backend"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = "."

[tool.pyright]
pythonpath = ["."]
include = ["contracts", "ingestion", "streaming", "nlp", "backend", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]



